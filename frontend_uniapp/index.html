<!doctype html>
<html build-time="%BUILD_TIME%">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <script>
      var coverSupport =
        'CSS' in window &&
        typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
          (coverSupport ? ', viewport-fit=cover' : '') +
          '" />',
      )
    </script>
    <title>%VITE_APP_TITLE%</title>
    <!-- JSSDK 未就绪/未认证公众号时的兜底分享卡片(og 标签),正常情况由 useShare 通过 JS-SDK 覆盖 -->
    <meta name="description" content="趣邻圈——发现身边的兴趣圈子、同好与线下活动" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="趣邻圈——发现身边的兴趣圈子、同好与线下活动" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_APP_OG_IMAGE%" />
    <!--preload-links-->
    <!--app-context-->
  </head>

  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
